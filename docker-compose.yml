x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:-nexcell-app:local}
  environment:
    DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-app}"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  logging: *default-logging
  init: true
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    logging: *default-logging

  redis:
    image: redis:7.2.5-alpine
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    logging: *default-logging

  migrate:
    <<: *app
    command: ["python", "-m", "app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    cpus: 0.25
    mem_limit: 256m

  api:
    <<: *app
    build:
      context: .
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 1g

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from app.config import get_redis; get_redis(2).ping()"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g

volumes:
  postgres_data: