name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: ci-test-password
  POSTGRES_DB: app
  APP_PORT: "8000"
  APP_IMAGE: nexcell-app:${{ github.sha }}

jobs:
  test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate smoke test syntax
        run: bash -n smoke_test.sh

      - name: Build production image
        run: docker build -t "$APP_IMAGE" .

      - name: Verify image
        run: |
          test "$(docker inspect "$APP_IMAGE" --format '{{.Config.User}}')" = "appuser"
          docker inspect "$APP_IMAGE" --format '{{json .Config.Healthcheck}}'

      - name: Pull infrastructure images
        run: docker compose pull postgres redis

      - name: Start stack with tested image
        run: docker compose up -d --no-build

      - name: Wait for application readiness
        run: |
          for attempt in {1..30}; do
            if curl -fsS \
              --connect-timeout 2 \
              --max-time 5 \
              http://localhost:8000/ready > /dev/null; then
              echo "Application ready after attempt ${attempt}"
              exit 0
            fi

            echo "Waiting for application (${attempt}/30)"
            sleep 2
          done

          echo "Application did not become ready"
          docker compose ps -a
          docker compose logs --no-color
          exit 1

      - name: Show container status
        run: docker compose ps -a

      - name: Run smoke tests
        run: ./smoke_test.sh

      - name: Save tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$APP_IMAGE" | gzip > nexcell-image.tar.gz

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ github.sha }}
          path: nexcell-image.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans