name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  POSTGRES_USER: ${{ vars.CI_POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ vars.CI_POSTGRES_DB }}
  APP_PORT: ${{ vars.CI_APP_PORT }}
  APP_IMAGE: nexcell-app:${{ github.sha }}

jobs:
  test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CI configuration
        run: |
          test -n "$POSTGRES_USER" || {
            echo "CI_POSTGRES_USER is missing"
            exit 1
          }

          test -n "$POSTGRES_PASSWORD" || {
            echo "CI_POSTGRES_PASSWORD is missing"
            exit 1
          }

          test -n "$POSTGRES_DB" || {
            echo "CI_POSTGRES_DB is missing"
            exit 1
          }

          test -n "$APP_PORT" || {
            echo "CI_APP_PORT is missing"
            exit 1
          }

      - name: Validate smoke test syntax
        run: bash -n smoke_test.sh

      - name: Build production image
        run: docker build -t "$APP_IMAGE" .

      - name: Verify image configuration
        run: |
          test "$(docker inspect "$APP_IMAGE" \
            --format '{{.Config.User}}')" = "appuser"

          docker inspect "$APP_IMAGE" \
            --format '{{json .Config.Healthcheck}}'

      - name: Pull infrastructure images
        run: docker compose pull postgres redis

      - name: Start stack with tested image
        run: docker compose up -d --no-build

      - name: Wait for application readiness
        run: |
          for attempt in {1..30}; do
            if curl -fsS \
              --connect-timeout 2 \
              --max-time 5 \
              "http://localhost:${APP_PORT}/ready" > /dev/null; then

              echo "Application ready after attempt ${attempt}"
              exit 0
            fi

            echo "Waiting for application (${attempt}/30)"
            sleep 2
          done

          echo "Application did not become ready"
          docker compose ps -a
          docker compose logs --no-color
          exit 1

      - name: Verify container health and migration
        run: |
          api_id="$(docker compose ps -q api)"
          worker_id="$(docker compose ps -q worker)"
          redis_id="$(docker compose ps -q redis)"
          postgres_id="$(docker compose ps -q postgres)"
          migrate_id="$(docker compose ps -a -q migrate)"

          test -n "$api_id"
          test -n "$worker_id"
          test -n "$redis_id"
          test -n "$postgres_id"
          test -n "$migrate_id"

          for attempt in {1..30}; do
            api_health="$(docker inspect \
              --format '{{.State.Health.Status}}' "$api_id")"

            worker_health="$(docker inspect \
              --format '{{.State.Health.Status}}' "$worker_id")"

            redis_health="$(docker inspect \
              --format '{{.State.Health.Status}}' "$redis_id")"

            postgres_health="$(docker inspect \
              --format '{{.State.Health.Status}}' "$postgres_id")"

            migration_exit="$(docker inspect \
              --format '{{.State.ExitCode}}' "$migrate_id")"

            echo "API=${api_health} Worker=${worker_health} Redis=${redis_health} Postgres=${postgres_health} MigrationExit=${migration_exit}"

            if [[ "$api_health" == "healthy" \
              && "$worker_health" == "healthy" \
              && "$redis_health" == "healthy" \
              && "$postgres_health" == "healthy" \
              && "$migration_exit" == "0" ]]; then

              echo "All containers passed health/status checks"
              exit 0
            fi

            sleep 2
          done

          echo "Container health/status verification failed"
          docker compose ps -a
          exit 1

      - name: Show container status
        run: docker compose ps -a

      - name: Run smoke tests
        run: ./smoke_test.sh

      - name: Save tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$APP_IMAGE" | gzip > nexcell-image.tar.gz

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ github.sha }}
          path: nexcell-image.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans